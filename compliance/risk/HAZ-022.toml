id = "HAZ-022"
type = "hazard"
title = "User datasets deleted from the sequencer unexpectedly"
status = "draft"
cause = "Cleanup is applied to a transfer folder whose users expect their files to stay, or to runs of a source no longer in the configuration"
harm = "A user loses the local copy of a dataset they still work with; if the share copy is later lost, the data is gone"
severity = "serious"
probability_before = "occasional"
