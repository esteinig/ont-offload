id = "HAZ-018"
type = "hazard"
title = "Records lost, or local disk filled by the records"
status = "draft"
cause = "The log file is never rotated, or is rotated by renaming while the daemon keeps writing to the renamed file, or is rotated with copytruncate; or old logs and events are pruned, or, since v0.9 keeps every record, they fill the disk unnoticed"
harm = "No record to investigate a failure or to answer a clinical lookback; a full local disk on the sequencer can stop acquisition and the offload"
severity = "serious"
probability_before = "occasional"
# v0.7: the log follows its name after a rotation (SRS-LOG-005, unit-tested with rename and removal) and packaging/ont-offload.logrotate rotates weekly or at 100 MB, keeping 12 compressed files; the service logs to its own folder (SRS-DEP-001). Proposed residual probability once reviewed: remote.
# v0.9: nothing is pruned any more (SRS-LOG-006): event segments are archived, logrotate keeps every file, and state.free_alert raises records_space_low before the disk of the records fills.
# Residual probability is set when the risk controls are verified.
probability_after = ""

[links]
controlled_by = ["SRS-LOG-005", "SRS-LOG-006", "SRS-DEP-001"]
