id = "HAZ-013"
type = "hazard"
title = "Daemon slowed or killed by resource growth"
status = "draft"
cause = "Journals of every run seen are kept in memory for the life of the process, journals are never compacted, and every scan walks the whole source tree and every unfinished run"
harm = "Offload delayed (slow scans, out-of-memory kill and restart)"
severity = "minor"
probability_before = "occasional"
