# v0.4: SRS-PAR-003 (round robin across runs) and SRS-STATE-001 (per-run backlog and ETA in state.json) implemented and verified. Proposed residual probability once reviewed: remote.
# Residual probability is set when the risk controls are verified.
probability_after = ""

