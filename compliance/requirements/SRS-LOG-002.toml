id = "SRS-LOG-002"
type = "requirement"
title = "File logging"
status = "draft"
release = "v0.1"
text = """
Also writes the same log lines to a file when one is configured, and refuses to start if it cannot be opened. `--log-file` and `--log-format` apply to every command; `watch` falls back to `logging.file` and `logging.format` from the configuration when they are not given.
"""
verification = "Integration test"

