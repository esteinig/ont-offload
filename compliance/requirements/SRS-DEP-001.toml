id = "SRS-DEP-001"
type = "requirement"
title = "Service user and private state"
status = "draft"
release = "v0.7"
text = """
The systemd unit runs watch as the dedicated user and group ont-offload (packaging/ont-offload.sysusers), with the state and log folders 0750, umask 0027 and no new privileges, so that the share sees one owner and only group members read state and logs; watch logs a warning when it runs as root.
"""
verification = "Packaging test of the unit and sysusers files; shell scripts parse"

