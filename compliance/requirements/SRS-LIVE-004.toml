id = "SRS-LIVE-004"
type = "requirement"
title = "Completed runs kept under watch"
status = "draft"
release = "v0.4"
text = """
Keeps watching a completed run for transfer.watch_completed_for (default 24 h) with a cheap check of folder modification times; when a file is added or changed, removes COMPLETE and VERIFIED.json from the destination before anything else, logs a warning, offloads the run again and writes a new manifest and COMPLETE.
"""
verification = "Simulator: file added an hour after COMPLETE; COMPLETE withdrawn before the first copy, new manifest matches"

[links]
allocated_to = ["SWI-SCHED", "SWI-RUN", "SWI-JOURNAL"]
mitigates = ["HAZ-012"]
