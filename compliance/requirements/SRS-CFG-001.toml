id = "SRS-CFG-001"
type = "requirement"
title = "Path validation"
status = "draft"
release = "v0.1"
text = """
Refuses to start when any configured path is empty, relative, contains a control character, has leading or trailing whitespace, is not valid UTF-8, or does not exist, and names the key with the value escaped.
"""
