id = "SRS-CFG-003"
type = "requirement"
title = "Strict configuration"
status = "draft"
release = "v0.1"
text = """
Rejects unknown configuration keys, unknown option values and invalid sizes, rates, durations, patterns and limits; sizes and rates need explicit units (KB, MB, GB, KiB, MiB, GiB, MB/s, Mbit/s, Gbit/s).
"""
verification = "Unit"

