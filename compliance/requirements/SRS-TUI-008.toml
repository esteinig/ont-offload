text = """
The themes plain, matrix, phosphor and synthwave can be chosen by flag, environment variable or configuration ([tui] theme) and switched with t; decoration (matrix rain, phosphor cursor, synthwave horizon) stops while an alert is open or shown in the banner, or the data is not current.
"""
