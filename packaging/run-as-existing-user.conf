# Drop-in: run ont-offload as an existing account instead of the dedicated
# ont-offload user, for example the standard "prom" user on a PromethION.
#
#   sudo systemctl edit ont-offload      # paste the [Service] lines below
#   # or: sudo install -D -m 0644 packaging/run-as-existing-user.conf \
#   #       /etc/systemd/system/ont-offload.service.d/user.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ont-offload
#
# systemd hands /var/lib/ont-offload and /var/log/ont-offload to this user
# at start. Also change the user in /etc/logrotate.d/ont-offload ("create"
# and "su" lines) and the group of /etc/ont-offload/config.toml, and run
# `sudo -u prom ont-offload check-config` to see how the share treats it.
[Service]
User=prom
Group=prom
