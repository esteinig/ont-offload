[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; compile-time only via ratatui, no fix upstream yet" },
  { id = "RUSTSEC-2026-0542", reason = "chrono is unmaintained; no safe update available for now" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # resvg and usvg (SVG images in report PDFs, feature `report`): file-level
  # copyleft, compatible with AGPL-3.0; used unmodified.
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
