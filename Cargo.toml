[workspace]
members = [".", "xtask", "tools/ont-runsim"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
authors = ["Eike Steinig"]
repository = "https://github.com/esteinig/ont-offload"
homepage = "https://esteinig.github.io/ont-offload"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
module_name_repetitions = "allow"

[package]
name = "ont-offload"
description = "Verified offload of ONT sequencing runs to mounted network storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["nanopore", "sequencing", "transfer", "clinical", "minknow"]
categories = ["command-line-utilities", "filesystem", "science"]
publish = false

[lib]
name = "ont_offload"
path = "src/lib.rs"

[[bin]]
name = "ont-offload"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Builds the FaultyFs fault-injection filesystem outside unit tests. Never enable for production builds.
fault-injection = []
# The read-only monitoring dashboard (`ont-offload tui`, SWI-TUI). Off by
# default so that the daemon's dependencies do not change.
tui = ["dep:ratatui", "dep:crossterm"]
# PDF rendering of reports (`ont-offload report --format pdf`) with typst
# embedded, so nothing has to be installed on the sequencer. Off by default
# so that the daemon's dependencies do not change; release builds enable it.
report = ["dep:typst", "dep:typst-pdf"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
fern = "0.7"
globset = { version = "0.4", default-features = false }
flate2 = "1"
humantime = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Dashboard only (feature `tui`).
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", optional = true }
# Reports only (feature `report`). typst 0.13 is the newest release that
# builds with the pinned toolchain (1.85).
typst = { version = "0.13", optional = true }
typst-pdf = { version = "0.13", optional = true }

# Free space (statvfs) on the source and the share; already used by ont-runsim.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
signal-hook = { version = "0.3", default-features = false }

[dev-dependencies]
assert_cmd = "2"
ont-runsim = { path = "tools/ont-runsim" }
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
